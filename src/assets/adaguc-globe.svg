<svg width="256" height="256" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="c">
      <circle cx="16" cy="16" r="14"/>
    </clipPath>
    <linearGradient id="shine" x1="6" y1="4" x2="26" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#c)">
    <!-- ocean/sky -->
    <circle cx="16" cy="16" r="14" fill="#2BA3D0"/>
    <!-- land -->
    <circle cx="16" cy="19.5" r="10.5" fill="#F1C92D"/>
    <circle cx="15" cy="24" r="8.5" fill="#6DBB25"/>
    <!-- soft directional shine, flat (not a glossy specular blob) -->
    <circle cx="16" cy="16" r="14" fill="url(#shine)"/>
  </g>

  <circle cx="16" cy="16" r="14.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="1.4"/>
</svg>
